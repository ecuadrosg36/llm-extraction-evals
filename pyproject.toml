[project]
name = "receipt-pipeline"
version = "0.1.0"
description = "Evidence-aware receipt extraction with auditable data quality and evaluation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "anthropic>=0.84", "pydantic>=2.11", "psycopg[binary]>=3.2",
  "python-dotenv>=1.0", "datasets>=3.5", "Pillow>=11", "huggingface-hub>=0.30",
  "dagster>=1.10", "dagster-webserver>=1.10", "dbt-postgres>=1.9", "deepeval>=3.0",
]
[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]
[project.scripts]
receipts = "receipt_pipeline.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/receipt_pipeline"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires local Postgres"]
