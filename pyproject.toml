[project]
name = "llm-extraction-evals"
version = "0.1.0"
description = "Structured extraction with Claude and Gemini, with evidence per field and an eval that scores every field."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Enmanuel Cuadros" }]
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
claude = ["anthropic>=0.80"]
gemini = ["google-genai>=1.0"]

[project.scripts]
evals = "extraction_evals.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "anthropic>=0.80", "google-genai>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/extraction_evals"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
addopts = "--cov=extraction_evals --cov-report=term-missing"
